services:
  
  api:
    build: .
    command: python -m uvicorn src.api.main:app --reload --host 127.0.0.1 --port 8000
    # command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped


  dashboard:
    build: .
    command: python -m streamlit run src/dashboard/app.py
    ports:
      - "8501:8501"
    restart: unless-stopped
  

  scheduler:
    build: .
    command: python -m src.scheduler.scheduler
    restart: unless-stopped