catchment:
  catchment_path: "data/catchment/catchment_queich_siebeldingen.gpkg"


discharge:
  url: "https://geodaten-wasser.rlp-umwelt.de/api/data/messstellen_wasserstand_abflusswerte_30?w=messstellennummer=2377050700"
  
  headers:
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Referer: "https://geodaten-wasser.rlp-umwelt.de/"


icon:
  url: "https://opendata.dwd.de/weather/nwp/icon-d2/grib/00/tot_prec/"
  compressed_dir: "data/forecast_precip/icon_d2/compressed"
  decompressed_dir: "data/forecast_precip/icon_d2/decompressed"
  clip_crs: "EPSG: 4326"


radolan:
  url: "https://opendata.dwd.de/climate_environment/CDC/grids_germany/5_minutes/radolan/recent/"
  compressed_dir: "data/observed_precip/radolan/compressed"
  decompressed_dir: "data/observed_precip/radolan/decompressed"


temp:
  url: "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/recent/zehn_min_tu_Beschreibung_Stationen.txt"
  
  stations_col_names:
  - stations_id
  - start_date
  - end_date
  - stations_alt
  - lat
  - lon
  - stations_name
  - county
  - license

  crs_4326: "EPSG:4326"
  crs_25832: "EPSG:25832"
  buffer_size: 20_000
  stations_write_path: "jobs/temp/stations.py"
  